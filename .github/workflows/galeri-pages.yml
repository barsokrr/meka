name: Deploy Galeri (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "public/images/interior-design/**"
      - "scripts/build-static-galeri.sh"
      - "scripts/render-static-galeri.mjs"
      - ".github/workflows/galeri-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galeri-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static galeri site
        run: chmod +x scripts/build-static-galeri.sh && ./scripts/build-static-galeri.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .static-galeri-site

      - id: deployment
        uses: actions/deploy-pages@v4

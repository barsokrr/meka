name: Publish Elmalik Hakedis (gh-pages)

on:
  push:
    branches: [main]
    paths:
      - "public/elmalik/**"
      - ".github/workflows/elmalik-pages.yml"
      - "scripts/publish-elmalik-gh-pages.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rm -rf /tmp/gh-pages/elmalik
          mkdir -p /tmp/gh-pages/elmalik
          cp -a public/elmalik/. /tmp/gh-pages/elmalik/
          cd /tmp/gh-pages
          git add elmalik
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish elmalik hakediş mobil portal"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages

name: Deploy Kalip Mobile (GitHub Pages)

# Devre dışı: yalnızca kalip yüklemek tüm GitHub Pages sitesini bozar.
# Mobil portal: publish-mobil-gh-pages.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kalip-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/kalip

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

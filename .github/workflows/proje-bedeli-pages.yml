name: Publish Proje Bedeli (gh-pages)

on:
  push:
    branches: [main]
    paths:
      - "public/proje-bedeli/**"
      - ".github/workflows/proje-bedeli-pages.yml"
      - "scripts/publish-proje-bedeli-gh-pages.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          node scripts/build-proje-bedeli-tek-dosya.mjs
          rm -rf /tmp/gh-pages/proje-bedeli
          mkdir -p /tmp/gh-pages/proje-bedeli
          cp -a public/proje-bedeli/. /tmp/gh-pages/proje-bedeli/
          cd /tmp/gh-pages
          git add proje-bedeli
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish proje bedeli hesaplayıcı (iç mimarlık algoritması)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages

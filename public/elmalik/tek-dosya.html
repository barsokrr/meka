<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1f4e79"/>
<title>Elmalık Villa Hakediş — Tek Dosya</title>
<style>
:root{--brand:#1f4e79;--muted:#64748b;--line:#e2e8f0;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f0f4f8;color:#1a1a1a;line-height:1.45;padding:1rem;padding-bottom:2rem;max-width:560px;margin:0 auto}
h1{font-size:1.25rem;color:var(--brand);margin:0.5rem 0}
.pill{background:#dbeafe;color:#1e3a5f;padding:.2rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700}
.card{background:#fff;border-radius:14px;padding:1rem;margin:.65rem 0;box-shadow:0 4px 16px rgba(31,78,121,.08)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:.4rem .1rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;width:42%}
.big{font-size:1.15rem;font-weight:800;color:#e94560}
.warn{background:#fff7ed}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:420px}
input.pct{width:4rem;padding:.3rem;border-radius:8px;border:1px solid var(--line);text-align:right}
.note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:1rem}
</style>
</head>
<body>
<span class="pill">TEK DOSYA · OFFLINE</span>
<h1>Elmalık Villa Hakediş</h1>
<p style="font-size:.88rem;color:var(--muted);margin-top:0">VAN/EDREMİT/ELMALIK · Teklif_1_2328</p>

<div class="card">
  <table>
    <tr><th>Sözleşme matrahı</th><td>576.023,00 TL</td></tr>
    <tr><th>Teklif genel toplam</th><td class="big">691.227,60 TL</td></tr>
  </table>
</div>

<div class="card scroll">
  <b>İmalat kalemleri</b>
  <table id="tbl"></table>
</div>

<div class="card">
  <b>Bu dönem % (kayıt telefonda)</b>
  <table id="pct-tbl"><tr><th>Kalem</th><th>%</th><th>Tutar</th></tr></table>
  <p style="margin:.75rem 0 0"><b>Matrah:</b> <span id="m">0</span> · <b>+KDV:</b> <span id="t">0</span></p>
</div>
<p class="note">İnternet gerekmez. Güncel sürüm: site /elmalik/</p>
<script>
var D={matrah:576023,goturu:186761.5,kalem:[
["T-03","Tavan alçıpan",32797.5],["T-04","Gergi tavan",13375],["T-05","Duvar çıtası",66989],
["T-07","Duvar kağıdı",202500],["T-08","İtalyan boya",73600],["T-GOT","Götürü kalemler",186761.5]
]};
function fmt(n){return n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL";}
var tb=document.getElementById("tbl");
D.kalem.forEach(function(r){
  var tr=document.createElement("tr");tr.innerHTML="<td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+fmt(r[2])+"</td>";tb.appendChild(tr);
});
var pt=document.getElementById("pct-tbl"),st={};
try{st=JSON.parse(localStorage.getItem("elmalik_tek")||"{}");}catch(e){}
function calc(){
  var m=0;
  D.kalem.forEach(function(r){
    var id=r[0],p=parseFloat(st[id])||0,m2=r[2]*(p/100);m+=m2;
    var el=document.getElementById("a"+id);if(el)el.textContent=fmt(m2);
  });
  document.getElementById("m").textContent=fmt(m);
  document.getElementById("t").textContent=fmt(m*1.2);
}
D.kalem.forEach(function(r){
  var tr=document.createElement("tr");
  var td0=document.createElement("td");td0.textContent=r[1];
  var td1=document.createElement("td");
  var inp=document.createElement("input");inp.className="pct";inp.type="number";inp.min=0;inp.max=100;
  inp.value=st[r[0]]||"";inp.oninput=function(){st[r[0]]=inp.value;localStorage.setItem("elmalik_tek",JSON.stringify(st));calc();};
  td1.appendChild(inp);
  var td2=document.createElement("td");td2.id="a"+r[0];td2.textContent="0,00 TL";
  tr.appendChild(td0);tr.appendChild(td1);tr.appendChild(td2);
  pt.appendChild(tr);
});
calc();
</script>
</body>
</html>

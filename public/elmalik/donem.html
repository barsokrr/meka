<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1f4e79"/>
<title>Dönem Hakediş — Elmalık Villa</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<a class="back" href="index.html" style="padding:1rem 1rem 0;display:block;max-width:560px;margin:0 auto">← Portal</a>
<header>
  <span class="pill">HAKEDİŞ DÖNEMİ</span>
  <h1>Bu dönem tutarı</h1>
  <p>Her kalem için tamamlanan oranı (0–100) girin. Telefonda otomatik kaydedilir.</p>
</header>
<main>
  <div class="card">
    <label for="donem-ad" style="font-size:0.85rem;font-weight:600;color:var(--muted)">Dönem adı</label>
    <input id="donem-ad" type="text" placeholder="Örn: 1. Hakediş — Ekim 2026" style="width:100%;margin-top:0.35rem;padding:0.55rem;border-radius:8px;border:1px solid var(--line)"/>
  </div>

  <div class="card scroll-x" id="liste"></div>

  <div class="sticky-total">
    <div class="card dark">
      <h2>Bu dönem özeti</h2>
      <table>
        <tr><th>Matrah (KDV hariç)</th><td id="out-matrah" class="big">0,00 TL</td></tr>
        <tr><th>KDV %20</th><td id="out-kdv">0,00 TL</td></tr>
        <tr><th>Tahsil (matrah + KDV)</th><td id="out-toplam" class="big">0,00 TL</td></tr>
      </table>
    </div>
  </div>
</main>
<footer class="note">Çift imzalı saha tutanağı ile birlikte kullanın</footer>
<script src="data.js"></script>
<script>
(function () {
  var D = window.ELMALIK_HAKEDIS;
  var KEY = "elmalik_hakedis_pct_v1";
  var state = {};
  try {
    state = JSON.parse(localStorage.getItem(KEY) || "{}");
  } catch (e) {
    state = {};
  }

  var liste = document.getElementById("liste");
  var h2 = document.createElement("h2");
  h2.textContent = "Kalemler";
  liste.appendChild(h2);
  var table = document.createElement("table");
  table.innerHTML = "<tr><th>Kalem</th><th>Söz. tutar</th><th>Bu dönem %</th><th>Tutar</th></tr>";
  liste.appendChild(table);

  var rows = [];
  D.kalem.forEach(function (k) {
    if (k.tutar == null) return;
    rows.push({ id: k.poz, label: k.ad, tutar: k.tutar });
  });
  rows.push({ id: "T-GOT", label: "Götürü kalemler (toplu)", tutar: D.goturuToplam });

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function recalc() {
    var matrah = 0;
    rows.forEach(function (r) {
      var pct = parseFloat(state[r.id]) || 0;
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      var t = r.tutar * (pct / 100);
      matrah += t;
      var el = document.getElementById("amt-" + r.id);
      if (el) el.textContent = window.elmalikFormatTL(t);
    });
    var kdv = matrah * 0.2;
    document.getElementById("out-matrah").textContent = window.elmalikFormatTL(matrah);
    document.getElementById("out-kdv").textContent = window.elmalikFormatTL(kdv);
    document.getElementById("out-toplam").textContent = window.elmalikFormatTL(matrah + kdv);
  }

  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    var tdL = document.createElement("td");
    tdL.textContent = r.label;
    var tdS = document.createElement("td");
    tdS.textContent = window.elmalikFormatTL(r.tutar);
    var tdP = document.createElement("td");
    var inp = document.createElement("input");
    inp.type = "number";
    inp.min = "0";
    inp.max = "100";
    inp.step = "1";
    inp.className = "pct";
    inp.inputMode = "decimal";
    inp.value = state[r.id] != null ? state[r.id] : "";
    inp.id = "pct-" + r.id;
    inp.addEventListener("input", function () {
      state[r.id] = inp.value;
      if (state.donemAd) state.donemAd = document.getElementById("donem-ad").value;
      save();
      recalc();
    });
    tdP.appendChild(inp);
    var tdA = document.createElement("td");
    tdA.id = "amt-" + r.id;
    tdA.textContent = "0,00 TL";
    tr.appendChild(tdL);
    tr.appendChild(tdS);
    tr.appendChild(tdP);
    tr.appendChild(tdA);
    table.appendChild(tr);
  });

  var donemInp = document.getElementById("donem-ad");
  donemInp.value = state.donemAd || "";
  donemInp.addEventListener("input", function () {
    state.donemAd = donemInp.value;
    save();
  });

  recalc();
})();
</script>
</body>
</html>
